  #     max_results: 20
  #     max_excerpt_lines: 200
  #     max_file_bytes: 1048576

connectors:
  # `enabled` lists connector instance ids defined under `instances`.
  enabled: []
  instances: {}
  # instances:
  #   example-intake:
  #     type: gcp-pubsub
  #     source:
  #       type: pubsub
  #       project: ${GCP_PROJECT}
  #       subscription: ${GCP_PUBSUB_SUBSCRIPTION}
  #       gcs_payload:                    # optional GCS object referenced by the Pub/Sub message
  #         enabled: true
  #         bucket_field: bucket
  #         name_field: name
  #         metadata_key: email_text
  #         max_bytes: 200000
  #         parser: email                 # `text` (default) or RFC 822/MIME email parsing
  #         max_body_chars: 4000          # `email` only: text/plain preferred, HTML fallback
  #     target:
  #       workflow: example-workflow
  #     parsing:
  #       email_extract:                  # optional regexes over parsed headers and body
  #         incident_id: "Incident: ([A-Z0-9-]+)"
  #         description: body

message_bus:
  # Supported providers: mattermost, slack.
  provider: mattermost
  api_url: http://mattermost:8065
  team_name: platform
  bot_token_secret: message_bus_bot_token
  # Required only for Slack Socket Mode.
  app_token_secret: message_bus_app_token
  # Required only for Mattermost interactive approval buttons.
  action_callback_secret: message_action_callback_secret

# To use Slack instead, replace the message_bus mapping above with:
# message_bus:
#   provider: slack
#   api_url: https://slack.com/api
#   bot_token_secret: message_bus_bot_token
#   app_token_secret: message_bus_app_token
#
# Slack requires a bot token with chat:write, channels:read, groups:read, and
# access to every configured messaging.channels channel. It also requires a
# Socket Mode app token. action_callback_secret is not used by Slack.
# Mattermost requires the bot token and api_url; team_name selects ambiguous
# channel names. Its approval buttons call the public gateway callback URL and
# use action_callback_secret as a gateway-internal callback value.

runtime_bundles:
  storage: s3
  bucket: agentic-ops-bundles
  retention_versions: 20

# These env vars are injected into every ephemeral agent runtime container.
# Use `null` to explicitly remove a built-in runtime env var.
# Keep workflow-independent flags here. Model-specific values can live under
# model_profiles and be selected from a workflow's session.model.
runtime_env:
  ANTHROPIC_API_KEY: null
  DISABLE_TELEMETRY: true
  DISABLE_ERROR_REPORTING: true
  DISABLE_FEEDBACK_COMMAND: true
  CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY: true
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: true
  CLAUDE_CODE_DISABLE_TERMINAL_TITLE: true

# If a workflow omits session.model, this profile is used automatically.
default_model_profile: example

# Workflows can set session.model to a profile name such as `example`. If no
# matching profile exists, the value is treated as a direct
# model name and applied to ANTHROPIC_MODEL plus the Claude Code defaults.
# String values of the form `${ENV_VAR}` are resolved from the service process
# environment at load time, which is useful for local provider API keys.
model_profiles:
  example:
    ANTHROPIC_BASE_URL: http://model-gateway:1235
    ANTHROPIC_AUTH_TOKEN: ${LLM_API_KEY}
    ANTHROPIC_MODEL: example-model
    ANTHROPIC_DEFAULT_OPUS_MODEL: example-model
    ANTHROPIC_DEFAULT_SONNET_MODEL: example-model
    ANTHROPIC_DEFAULT_HAIKU_MODEL: example-model
    CLAUDE_CODE_SUBAGENT_MODEL: example-model
    CLAUDE_CODE_THINKING_MODE: default
    CLAUDE_CODE_MAX_OUTPUT_TOKENS: "8192"
    CLAUDE_CODE_MAX_CONTEXT_TOKENS: "65536"
    CLAUDE_CODE_AUTO_COMPACT_WINDOW: "65536"
    CLAUDE_AUTOCOMPACT_PCT_OVERRIDE: "90"

memory:
  backend: hindsight
  banks:
    business: {}
    learning: {}

secrets:
  github_public_app_private_key:
    encrypted: ENC[age,replace-with-encrypted-github-app-private-key-pem]
  # github_enterprise_app_private_key:
  #   encrypted: ENC[age,replace-with-encrypted-ghes-app-private-key-pem]
  message_bus_bot_token:
    encrypted: ENC[age,replace-with-encrypted-token]
  message_bus_app_token:
    encrypted: ENC[age,replace-with-encrypted-app-token]
  message_action_callback_secret:
    encrypted: ENC[age,replace-with-encrypted-action-secret]
  # GCP connectors use this when Kubernetes workload identity is unavailable.
  # It is materialized as a temporary ADC file inside the connector process.
  GCP_SERVICE_ACCOUNT_JSON:
    encrypted: ENC[age,replace-with-encrypted-service-account-json]
