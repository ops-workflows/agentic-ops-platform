{{- range $name, $mcp := .Values.mcps }}
{{- if $mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentic-ops.fullname" $ }}-mcp-{{ $name }}
  labels:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp
        app.kubernetes.io/name: {{ $name }}
    spec:
      {{- include "agentic-ops.imagePullSecrets" $ | nindent 6 }}
      containers:
        - name: mcp-{{ $name }}
          image: {{ $.Values.images.mcp.repository }}:{{ $.Values.images.mcp.tag }}
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          command: ["python", "-m", "uvicorn", "{{ $mcp.module }}:app", "--host", "0.0.0.0", "--port", "{{ $mcp.port }}"]
          ports:
            - name: http
              containerPort: {{ $mcp.port }}
          env:
            {{- include "agentic-ops.commonEnv" $ | nindent 12 }}
            {{- if eq $name "knowledge" }}
            - name: KNOWLEDGE_SOURCE_OBJECT_STORE_BUCKET
              value: {{ required "knowledgeSources.objectStoreBucket is required" $.Values.knowledgeSources.objectStoreBucket | quote }}
            - name: KNOWLEDGE_SOURCE_SERVING_CACHE_ROOT
              value: {{ $.Values.knowledgeMcp.cacheRoot | quote }}
            - name: KNOWLEDGE_SOURCE_REFRESH_INTERVAL_SEC
              value: {{ $.Values.knowledgeMcp.refreshIntervalSec | quote }}
            - name: KNOWLEDGE_SOURCE_CACHE_VERSIONS_TO_KEEP
              value: {{ $.Values.knowledgeMcp.versionsToKeep | quote }}
            {{- end }}
          {{- if $.Values.bootstrap.existingSecret }}
          envFrom:
            {{- include "agentic-ops.bootstrapEnvFrom" $ | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "agentic-ops.commonVolumeMounts" $ | nindent 12 }}
            {{- if eq $name "knowledge" }}
            - name: knowledge-serving-cache
              mountPath: {{ $.Values.knowledgeMcp.cacheRoot }}
            {{- end }}
      volumes:
        {{- include "agentic-ops.commonVolumes" $ | nindent 8 }}
        {{- if eq $name "knowledge" }}
        - name: knowledge-serving-cache
          {{- if $.Values.knowledgeMcp.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-knowledge-cache" (include "agentic-ops.fullname" $)) $.Values.knowledgeMcp.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-ops.fullname" $ }}-mcp-{{ $name }}
spec:
  selector:
    app.kubernetes.io/component: mcp
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $mcp.port }}
      targetPort: http
---
{{- end }}
{{- end }}
